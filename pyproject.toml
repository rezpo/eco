[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eco"
version = "1.1.0"
description = "macOS internal audio recorder and AI meeting assistant"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "soundfile>=0.12.1",
    "deepgram-sdk>=3.0.0",
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
eco = "eco:main"

[tool.setuptools]
py-modules = ["eco", "sidekick", "llm_client", "chrome_capture"]
